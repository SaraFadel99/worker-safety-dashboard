<div class="search-container">
  <h2>Search for a location</h2>

  <div class="search-box">
    <input
      type="text"
      [(ngModel)]="query"
      (keyup.enter)="onSearch()"
      (input)="onSearch()"
        [disabled]="disabled || isLoading()"
      placeholder="Type an address or place..."
      autocomplete="off"
    />
    <button (click)="onSearch()"   [disabled]="disabled || isLoading()">Search</button>
  </div>

  @if (isLoading()) {
    <p>Searching...</p>
  }

  <ul class="results">
    @for (r of results(); track r.label) {
      <li (click)="selectResult(r)">
        {{ r.label }}
      </li>
    }
  </ul>

@if (pendingLocation()) {
  <div class="status-bar confirm">
    <div class="address">
      <strong>Selected location:</strong>
      <span>{{ pendingLocation()?.label }}</span>
    </div>

    <div class="actions">
      <button class="btn cancel" (click)="cancelLocation()">Cancel</button>
      <button class="btn confirm" (click)="confirmLocation()">Confirm</button>
    </div>
  </div>
}
</div>
